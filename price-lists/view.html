<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>toka price list</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  /* Price list viewer, opened from the Sales page (view.html?b2b or ?b2c):
     the sheet as a picture (shows the same on every phone), with a bar to
     download the PDF or close — like the invoice window. */
  body { margin: 0; background: #d9d3c3; font-family: "DM Sans", sans-serif; }
  .bar { position: sticky; top: 0; z-index: 2; display: flex; gap: 10px; justify-content: center; padding: 12px; background: #4A3728; }
  .bar a, .bar button { font-family: "DM Sans", sans-serif; font-size: 13px; font-weight: 500; padding: 9px 18px; border-radius: 2px; border: 1px solid #EDE8DA; background: #EDE8DA; color: #4A3728; cursor: pointer; text-decoration: none; }
  .bar .g { background: none; color: #EDE8DA; }
  .sheet { display: block; width: 210mm; max-width: calc(100% - 32px); height: auto; margin: 24px auto; box-shadow: 0 2px 18px rgba(0,0,0,.12); background: #EDE8DA; }
  @media (max-width: 820px) { .sheet { max-width: 100%; margin: 0; box-shadow: none; } }
</style>
</head>
<body>
<div class="bar"><a id="dl" href="#">download pdf</a><button class="g" onclick="window.close(); if (!window.closed) history.back();">close</button></div>
<img class="sheet" id="sheet" alt="toka price list">
<script>
  var kind = /b2b/i.test(location.search) ? 'b2b' : 'b2c';
  document.title = kind === 'b2b' ? 'toka wholesale prices' : 'toka prices';
  document.getElementById('sheet').src = 'toka_prices_' + kind + '.jpg';
  var dl = document.getElementById('dl');
  dl.href = 'toka_prices_' + kind + '.pdf';
  dl.setAttribute('download', 'toka_prices_' + kind + '.pdf');
</script>
</body>
</html>
